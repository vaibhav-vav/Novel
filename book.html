<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Beast Breakdown — Chapter Reading Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet" />
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #c9a84c;
      --gold-lt:   #f0d080;
      --gold-dim:  #7a6020;
      --gold-neon: #ffe066;
      --black:     #060606;
      --dark:      #0e0e0e;
      --mid:       #181818;
      --white:     #f5f5f5;
      --muted:     #777777;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* GLOBAL GOLDEN MIST LAYER */
    body::before {
      content: '';
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 50% at 50% 0%,   rgba(201,168,76,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 30%,  rgba(201,168,76,0.05) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 90% 60%,  rgba(201,168,76,0.05) 0%, transparent 55%),
        radial-gradient(ellipse 80% 30% at 50% 100%, rgba(201,168,76,0.06) 0%, transparent 60%);
    }

    nav, main, footer { position: relative; z-index: 1; }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 5%;
      background: rgba(6,6,6,0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(201,168,76,0.18);
      box-shadow: 0 2px 40px rgba(201,168,76,0.06);
    }

    .nav-logo {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      color: var(--gold);
      letter-spacing: 1px;
      text-decoration: none;
      text-shadow: 0 0 12px rgba(201,168,76,0.5);
    }

    .updates-nav {
      background: transparent;
      color: var(--gold-lt);
      border: 1px solid var(--gold);
      padding: .65rem .85rem;
      font: inherit;
      cursor: pointer;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .updates-nav:hover {
      background: rgba(201,168,76,0.1);
      color: var(--gold-neon);
      border-color: var(--gold-neon);
    }

    main {
      flex: 1;
      padding: 8rem 5% 5rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.8rem;
      text-shadow: 0 0 8px rgba(201,168,76,0.4);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(to right, var(--gold-neon), var(--gold), transparent);
      margin: 1.4rem 0 2.8rem;
      box-shadow: 0 0 8px rgba(255,224,102,0.4);
    }

    .cinzel-neon {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold-neon);
      text-shadow:
        0 0 6px  rgba(255,224,102,0.95),
        0 0 18px rgba(201,168,76,0.85),
        0 0 35px rgba(201,168,76,0.55),
        0 0 70px rgba(201,168,76,0.3);
    }

    .book-header-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 3rem;
      align-items: center;
      background: var(--dark);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 2.5rem;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(201,168,76,0.08);
      margin-bottom: 3rem;
    }

    .book-cover-img {
      width: 100%;
      height: 310px;
      object-fit: cover;
      border: 1px solid var(--gold);
      border-radius: 2px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }

    .book-info h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      color: var(--gold-neon);
      line-height: 1.2;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px rgba(201,168,76,0.4);
    }

    .book-info p.subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 1.2rem;
    }

    .book-info p.description {
      color: rgba(245,245,245,0.75);
      font-size: 0.95rem;
      font-style: italic;
      border-left: 2px solid var(--gold);
      padding-left: 1rem;
    }

    .chapters-list {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .chapter-link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--dark);
      border: 1px solid rgba(201,168,76,0.22);
      padding: 1.2rem 1.8rem;
      border-radius: 3px;
      text-decoration: none;
      color: var(--gold-lt);
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      transition: all 0.3s;
    }
    .chapter-link-item:hover {
      border-color: var(--gold-neon);
      background: rgba(201,168,76,0.06);
      transform: translateX(4px);
      box-shadow: 0 0 20px rgba(201,168,76,0.15);
      color: var(--gold-neon);
    }

    .chapter-container {
      background: var(--dark);
      border: 1px solid rgba(201,168,76,0.3);
      padding: 3rem;
      border-radius: 4px;
      box-shadow: 0 0 50px rgba(201,168,76,0.08);
    }

    .chapter-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 2.15;
      font-size: 1.12rem;
      color: rgba(245,245,245,0.92);
      margin-top: 2rem;
    }

    .chapter-nav-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201,168,76,0.2);
    }

    .locked-card {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--dark);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 4px;
      box-shadow: 0 0 50px rgba(201,168,76,0.1);
    }

    .btn {
      display: inline-block;
      padding: 0.82rem 2.2rem;
      border-radius: 2px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.35s;
      border: none;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--black);
      border: 2px solid var(--gold);
      box-shadow: 0 0 20px rgba(201,168,76,0.3);
    }
    .btn-primary:hover {
      background: var(--gold-neon);
      border-color: var(--gold-neon);
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255,224,102,0.5);
    }

    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 2px solid rgba(201,168,76,0.45);
    }
    .btn-outline:hover {
      border-color: var(--gold-neon);
      color: var(--gold-neon);
      background: rgba(201,168,76,0.07);
    }

    footer {
      background: var(--dark);
      border-top: 1px solid rgba(201,168,76,0.12);
      text-align: center;
      padding: 2.5rem 5%;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .book-header-card { grid-template-columns: 1fr; text-align: center; gap: 1.5rem; padding: 1.5rem; }
      .book-cover-img { width: 180px; height: 260px; margin: 0 auto; }
      .book-info p.description { border-left: none; border-top: 2px solid var(--gold); padding-left: 0; padding-top: 1rem; }
      .chapter-container { padding: 1.5rem; }
      .chapter-nav-btns { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="updates-nav" id="backNavBtn" href="index.html#library">← Back to Library</a>
    <a class="nav-logo" href="index.html">Beast Breakdown</a>
    <a class="updates-nav" href="index.html">Home</a>
  </nav>

  <main id="mainContainer">
    <div style="text-align:center; padding: 4rem 0;">
      <p class="section-label">Loading Page...</p>
      <h2 class="cinzel-neon" style="font-size:1.6rem;">Entering the Realm...</h2>
    </div>
  </main>

  <footer>
    <p>© 2026 Vaibhav Singh Raghuvanshi. All rights reserved.</p>
    <p style="margin-top:0.4rem; font-size:0.7rem;">Beast Breakdown — Fictional Medieval Age Novel Series</p>
  </footer>

  <script>
    // Supabase Initialization
    const SUPABASE_URL = 'https://yxbphievkdscjixgmgyu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LzsziIh2Mqm5FaCWeVS2NA_INBRjR-c';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Helper: Check if email is verified
    function isEmailVerified(user) {
      return user && user.email_confirmed_at !== null && user.email_confirmed_at !== undefined;
    }

    async function loadPage() {
      const mainContainer = document.getElementById('mainContainer');
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');
      const chapterIdParam = urlParams.get('chapter');

      if (!bookId) {
        mainContainer.innerHTML = `
          <div class="locked-card">
            <p class="section-label">Error</p>
            <h2 class="cinzel-neon" style="font-size:1.8rem; margin-bottom:1rem;">No Book Selected</h2>
            <p style="color:var(--muted); margin-bottom:2rem;">Please select a book from the Library on the homepage.</p>
            <a href="index.html" class="btn btn-primary">Return to Home</a>
          </div>
        `;
        return;
      }

      // Check Supabase authentication and follower verification
      const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
      const user = session ? session.user : null;

      if (!user || !isEmailVerified(user)) {
        mainContainer.innerHTML = `
          <div class="locked-card">
            <p class="section-label">✦ Verification Required ✦</p>
            <h2 class="cinzel-neon" style="font-size:1.8rem; margin-bottom:1rem;">Access Locked</h2>
            <p style="color:rgba(245,245,245,0.75); margin-bottom:2rem; line-height:1.8;">You must sign in and verify your account via OTP with <strong>4.vaibhav.14@gmail.com</strong> to read chapters from this book.</p>
            <a href="index.html" class="btn btn-primary">Sign In / Verify on Homepage</a>
          </div>
        `;
        return;
      }

      try {
        // Fetch book from Supabase 'librarybooks' table
        const { data: book, error } = await supabaseClient
          .from('librarybooks')
          .select('*')
          .eq('id', bookId)
          .maybeSingle();

        if (error || !book) {
          mainContainer.innerHTML = `
            <div class="locked-card">
              <p class="section-label">Not Found</p>
              <h2 class="cinzel-neon" style="font-size:1.8rem; margin-bottom:1rem;">Book Not Found</h2>
              <p style="color:var(--muted); margin-bottom:2rem;">The requested book could not be loaded from the database.</p>
              <a href="index.html" class="btn btn-primary">Return to Library</a>
            </div>
          `;
          return;
        }

        const chapters = book.chapters || [];

        // CASE 1: Display specific Chapter Page if 'chapter' query param is provided
        if (chapterIdParam !== null && chapterIdParam !== undefined) {
          const chIdNum = parseInt(chapterIdParam, 10);
          const chIndex = chapters.findIndex(c => c.id === chIdNum);
          const chapter = chapters[chIndex];

          document.getElementById('backNavBtn').href = `book.html?id=${book.id}`;
          document.getElementById('backNavBtn').textContent = `← Back to ${book.title}`;

          if (!chapter) {
            mainContainer.innerHTML = `
              <div class="locked-card">
                <p class="section-label">Not Found</p>
                <h2 class="cinzel-neon" style="font-size:1.8rem; margin-bottom:1rem;">Chapter Not Found</h2>
                <p style="color:var(--muted); margin-bottom:2rem;">The requested chapter does not exist in this book.</p>
                <a href="book.html?id=${book.id}" class="btn btn-primary">Return to Book</a>
              </div>
            `;
            return;
          }

          document.getElementById('pageTitle').textContent = `${chapter.title} — ${book.title}`;

          const prevChapter = chIndex > 0 ? chapters[chIndex - 1] : null;
          const nextChapter = chIndex < chapters.length - 1 ? chapters[chIndex + 1] : null;

          mainContainer.innerHTML = `
            <div class="chapter-container fade-in">
              <p class="section-label">${book.title}</p>
              <h1 class="cinzel-neon" style="font-size: clamp(1.8rem, 3.5vw, 2.6rem); line-height:1.2; margin-bottom:0.5rem;">${chapter.title}</h1>
              <p style="color:var(--gold); font-size:0.85rem; letter-spacing:1px; margin-bottom:1.5rem; text-transform:uppercase;">${chapter.partName || book.title}</p>
              <div class="divider"></div>
              <div class="chapter-text">${chapter.text}</div>

              <div class="chapter-nav-btns">
                ${prevChapter ? `<a href="book.html?id=${book.id}&chapter=${prevChapter.id}" class="btn btn-outline">← ${prevChapter.title}</a>` : '<div></div>'}
                ${nextChapter ? `<a href="book.html?id=${book.id}&chapter=${nextChapter.id}" class="btn btn-primary">${nextChapter.title} →</a>` : '<div></div>'}
              </div>
            </div>
          `;
          return;
        }

        // CASE 2: Display Book Overview Page with List of Chapters
        document.getElementById('pageTitle').textContent = `${book.title} — Beast Breakdown`;
        document.getElementById('backNavBtn').href = 'index.html#library';
        document.getElementById('backNavBtn').textContent = '← Back to Library';

        mainContainer.innerHTML = `
          <div class="book-header-card fade-in">
            <div>
              <img src="${book.cover || 'book-cover.jpg'}" alt="${book.title}" class="book-cover-img" onerror="this.src='book-cover.jpg'">
            </div>
            <div class="book-info">
              <p class="section-label">Fictional Medieval Age Novel Series</p>
              <h1>${book.title}</h1>
              <p class="subtitle">${book.subtitle || ''}</p>
              <div class="divider" style="margin: 1rem 0;"></div>
              <p class="description">${book.description}</p>
              <p style="margin-top:1.5rem; color:var(--gold); font-size:0.85rem; font-family:'Cinzel',serif;">Author: Vaibhav Singh Raghuvanshi</p>
            </div>
          </div>

          <div class="chapters-section">
            <h2 class="cinzel-neon">Table of Contents (${chapters.length} Chapters)</h2>
            <div class="divider" style="margin: 0.8rem 0 2rem;"></div>

            ${chapters.length > 0 ? `
              <div class="chapters-list">
                ${chapters.map(ch => `
                  <a href="book.html?id=${book.id}&chapter=${ch.id}" class="chapter-link-item">
                    <span>✦ ${ch.title}</span>
                    <span style="font-size:0.75rem; letter-spacing:1px; color:var(--gold);">Read Chapter →</span>
                  </a>
                `).join('')}
              </div>
            ` : `
              <div style="text-align:center; padding:3rem; background:var(--dark); border:1px solid rgba(201,168,76,0.2);">
                <p style="color:var(--muted); font-style:italic;">No chapters published for this book yet. Check back soon for new releases from Vaibhav Singh Raghuvanshi!</p>
              </div>
            `}
          </div>

          <div style="text-align:center; margin-top:3rem;">
            <a href="index.html#library" class="btn btn-primary">← Back to Library</a>
          </div>
        `;

      } catch (err) {
        console.error('Error loading book page:', err);
        mainContainer.innerHTML = `
          <div class="locked-card">
            <p class="section-label">Error</p>
            <h2 class="cinzel-neon" style="font-size:1.8rem; margin-bottom:1rem;">Failed to Load Book</h2>
            <p style="color:var(--muted); margin-bottom:2rem;">An unexpected error occurred while communicating with Supabase.</p>
            <a href="index.html" class="btn btn-primary">Return to Library</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPage);
  </script>
</body>
</html>
